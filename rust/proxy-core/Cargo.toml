[package]
name = "proxy-core"
version = "0.1.0"
edition = "2021"
authors = ["Lightly Team"]
description = "High-performance proxy core with VLESS and Hysteria2 support"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "proxy_core"

[features]
default = []
mux-experimental = []

[[bin]]
name = "proxy-core-cli"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "tracing"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls_022 = { package = "rustls", version = "0.22", default-features = false, features = ["ring", "tls12"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"

# HTTP/2 and WebSocket
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = "0.26"
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.0"
http-body = "1.0"
http-body-util = "0.1"

# QUIC for Hysteria2
quinn = { version = "0.11", features = ["runtime-tokio", "rustls"] }
quinn-proto = "0.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1.6", features = ["v4", "fast-rng", "serde"] }
rand = "0.8"

# Data structures and utilities
bytes = "1.5"
futures = "0.3"
futures-util = "0.3"
pin-project = "1.1"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
crossbeam = "0.8"
dashmap = "5.5"
arc-swap = "1.7"

# Time and async utilities
tokio-stream = "0.1"
async-trait = "0.1"

# Logging
log = "0.4"
env_logger = "0.11"

# Network
trust-dns-resolver = { version = "0.23", features = ["tokio-runtime"] }
once_cell = "1.19"

[dependencies.jni]
version = "0.21"
default-features = false
optional = true

[dependencies.android_logger]
version = "0.14"
optional = true

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
android_logger = "0.14"
libc = "0.2"

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-with-debug]
inherits = "release"
strip = false
debug = true

[profile.dev]
opt-level = 1
