name: Release Android APK

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.41.6'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.14'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.10'
      optional_plugins:
        description: 'Optional companion APK handling'
        required: true
        type: choice
        options:
          - auto
          - build
          - reuse
        default: auto

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.version.outputs.commit_hash }}
      version: ${{ steps.version.outputs.version }}
      build_version: ${{ steps.version.outputs.build_version }}
      version_code: ${{ steps.version.outputs.version_code }}
      plugin_release_tag: ${{ steps.version.outputs.plugin_release_tag }}
      build_optional_plugins: ${{ steps.optional_plugins.outputs.build }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: ${{ env.GRADLE_VERSION }}
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi
    
    - name: Install cargo-ndk
      run: cargo install cargo-ndk
    
    - name: Build proxy-core native libraries
      run: |
        ./scripts/build_proxy_core.sh --all
        ls -lh android/app/src/main/jniLibs/*/libproxy_core.so
    
    - name: Get version info
      id: version
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        COMMIT_HASH=$(git rev-parse --short=6 HEAD)

        if [ "$EVENT_NAME" = "push" ]; then
          VERSION="$REF_NAME"
        else
          VERSION="$INPUT_VERSION"
        fi

        if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
          echo "Invalid release version: $VERSION" >&2
          exit 1
        fi

        git fetch --no-tags origin main:refs/remotes/origin/main
        COMMIT_COUNT=$(git rev-list --count origin/main)
        VERSION_CODE=$((5000 + COMMIT_COUNT))
        BUILD_VERSION="${VERSION}+${COMMIT_HASH}"
        PLUGIN_RELEASE_TAG="plugins-${BUILD_VERSION//[^[:alnum:].+-]/-}"

        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "commit_hash=${COMMIT_HASH}" >> "$GITHUB_OUTPUT"
        echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
        echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
        echo "plugin_release_tag=${PLUGIN_RELEASE_TAG}" >> "$GITHUB_OUTPUT"

        echo "Version: ${VERSION}"
        echo "Commit: ${COMMIT_HASH}"
        echo "Build version: ${BUILD_VERSION}"
        echo "Android versionCode: ${VERSION_CODE}"
        echo "Plugin release: ${PLUGIN_RELEASE_TAG}"
    
    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "KEYSTORE_BASE64 secret is not set" >&2
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
        if [ ! -f "android/app/upload-keystore.jks" ] || [ ! -s "android/app/upload-keystore.jks" ]; then
          echo "Keystore file was not created or is empty" >&2
          exit 1
        fi
        echo "Keystore decoded ($(stat -c%s "android/app/upload-keystore.jks") bytes)"

    - name: Fetch verified YouTube resolver AAR
      env:
        YOUTUBE_RESOLVER_AAR_URL: ${{ vars.YOUTUBE_RESOLVER_AAR_URL }}
        YOUTUBE_RESOLVER_AAR_SHA256: ${{ vars.YOUTUBE_RESOLVER_AAR_SHA256 }}
        YOUTUBE_RESOLVER_GITHUB_TOKEN: ${{ secrets.YOUTUBE_RESOLVER_GITHUB_TOKEN }}
      run: scripts/fetch_youtube_aar.sh

    - name: Decide optional plugin build mode
      id: optional_plugins
      env:
        REQUESTED_MODE: ${{ inputs.optional_plugins || vars.OPTIONAL_PLUGIN_BUILD_MODE || 'auto' }}
      run: |
        MODE="${REQUESTED_MODE,,}"
        case "$MODE" in
          build)
            BUILD_PLUGINS=1
            REASON="forced build"
            ;;
          reuse)
            BUILD_PLUGINS=0
            REASON="forced reuse"
            ;;
          auto)
            BASE_TAG=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
            if [ -z "$BASE_TAG" ]; then
              BUILD_PLUGINS=1
              REASON="no previous tag"
            elif git diff --quiet "$BASE_TAG" "$GITHUB_SHA" -- \
              extensions/telegram \
              extensions/webrtc \
              extensions/easytier \
              scripts/build_optional_plugins.sh \
              scripts/embed_optional_plugin_manifest.sh \
              scripts/verify_optional_plugin_bundle.sh \
              lib/features/optional_plugins \
              lib/app/optional_feature_coordinator.dart \
              android/app/src/main/aidl \
              android/app/src/main/kotlin/lightly/tool/OptionalPluginActivationCoordinator.kt \
              android/app/src/main/kotlin/lightly/tool/OptionalPluginChannelHandler.kt; then
              BUILD_PLUGINS=0
              REASON="no companion-related changes since $BASE_TAG"
            else
              BUILD_PLUGINS=1
              REASON="companion-related changes since $BASE_TAG"
            fi
            ;;
          *)
            echo "Invalid optional plugin mode: $MODE" >&2
            exit 1
            ;;
        esac
        echo "build=$BUILD_PLUGINS" >> "$GITHUB_OUTPUT"
        echo "Optional plugin mode: $MODE; build=$BUILD_PLUGINS ($REASON)"

    - name: Prepare Telegram TDLib dependency
      if: steps.optional_plugins.outputs.build == '1'
      run: extensions/telegram/scripts/prepare_tdlib.sh

    - name: Build optional plugin APKs and manifest
      if: steps.optional_plugins.outputs.build == '1'
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        PLUGIN_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        PLUGIN_VERSION_NAME: ${{ steps.version.outputs.build_version }}
        MINIMUM_LIGHTLY_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        PLUGIN_RELEASE_TAG: ${{ steps.version.outputs.plugin_release_tag }}
        PLUGIN_RELEASE_REPOSITORY: ${{ vars.PLUGIN_RELEASE_REPOSITORY || 'Easul/lightly-plugins' }}
        PLUGIN_GRADLE_OFFLINE: '0'
        PLUGIN_GRADLEW: gradle
        DEFER_LIGHTLY_CERT_VERIFY: '1'
      run: |
        scripts/build_optional_plugins.sh
        scripts/embed_optional_plugin_manifest.sh

    - name: Reuse latest published optional plugin manifest
      if: steps.optional_plugins.outputs.build != '1'
      env:
        GH_TOKEN: ${{ secrets.PLUGIN_RELEASE_TOKEN }}
        PLUGIN_RELEASE_REPOSITORY: ${{ vars.PLUGIN_RELEASE_REPOSITORY || 'Easul/lightly-plugins' }}
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "PLUGIN_RELEASE_TOKEN is required to reuse optional plugins" >&2
          exit 1
        fi
        LATEST_PLUGIN_TAG=$(gh api \
          "repos/$PLUGIN_RELEASE_REPOSITORY/releases/latest" \
          --jq .tag_name)
        if [ -z "$LATEST_PLUGIN_TAG" ]; then
          echo "No published optional plugin release is available to reuse" >&2
          exit 1
        fi
        mkdir -p build/optional-plugins
        gh release download "$LATEST_PLUGIN_TAG" \
          --repo "$PLUGIN_RELEASE_REPOSITORY" \
          --pattern plugins.json \
          --dir build/optional-plugins
        scripts/embed_optional_plugin_manifest.sh
        echo "Reused optional plugin manifest from $LATEST_PLUGIN_TAG"

    - name: Build multi-ABI APKs
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        RELEASE_VERSION_TAG: ${{ steps.version.outputs.version }}
        GRADLE_WORKERS: '2'
        ARM64_HEAP: 6G
        ARM32_HEAP: 8G
      run: |
        mkdir -p dist
        bash scripts/build_multi_abi.sh
        cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
          dist/app-arm64-v8a-release.apk
        cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
          dist/app-armeabi-v7a-release.apk
        (
          cd dist
          sha256sum *.apk > SHA256SUMS
          sha256sum -c SHA256SUMS
        )
        echo "Built and verified multi-ABI APKs via scripts/build_multi_abi.sh"

    - name: Verify optional plugins against final Lightly APK
      if: steps.optional_plugins.outputs.build == '1'
      run: scripts/verify_optional_plugin_bundle.sh
    
    - name: Show build artifacts
      run: |
        ls -lh dist/
        cat dist/SHA256SUMS
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-apks
        path: |
          dist/*.apk
          dist/SHA256SUMS
        retention-days: 7

    - name: Upload optional plugin artifacts
      if: steps.optional_plugins.outputs.build == '1'
      uses: actions/upload-artifact@v4
      with:
        name: optional-plugin-apks
        path: |
          build/optional-plugins/*.apk
          build/optional-plugins/plugins.json
        retention-days: 7

  release:
    name: Create Release
    needs: build-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout release metadata
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: android-apks
        path: dist/

    - name: Download optional plugin artifacts
      if: needs.build-android.outputs.build_optional_plugins == '1'
      uses: actions/download-artifact@v4
      with:
        name: optional-plugin-apks
        path: optional-plugins/

    - name: Verify release artifacts
      run: |
        ls -lh dist/
        (
          cd dist
          sha256sum -c SHA256SUMS
        )

    - name: Prepare versioned release notes
      env:
        VERSION: ${{ needs.build-android.outputs.version }}
        COMMIT_HASH: ${{ needs.build-android.outputs.commit_hash }}
        BUILD_VERSION: ${{ needs.build-android.outputs.build_version }}
        VERSION_CODE: ${{ needs.build-android.outputs.version_code }}
      run: |
        NOTES_PATH="docs/releases/${VERSION}.md"
        if [ -f "$NOTES_PATH" ]; then
          cp "$NOTES_PATH" release-body.md
        else
          printf '# Lightly %s\n\nSee the generated commit notes below.\n' \
            "$VERSION" > release-body.md
        fi
        {
          printf '\n## 构建信息 / Build Information\n\n'
          printf -- '- Version: `%s`\n' "$VERSION"
          printf -- '- Build label: `%s`\n' "$BUILD_VERSION"
          printf -- '- Commit: `%s`\n' "$COMMIT_HASH"
          printf -- '- Android versionCode: `%s`\n' "$VERSION_CODE"
        } >> release-body.md

    - name: Publish optional plugin release
      if: needs.build-android.outputs.build_optional_plugins == '1'
      env:
        GH_TOKEN: ${{ secrets.PLUGIN_RELEASE_TOKEN }}
        PLUGIN_RELEASE_REPOSITORY: ${{ vars.PLUGIN_RELEASE_REPOSITORY || 'Easul/lightly-plugins' }}
        PLUGIN_RELEASE_TAG: ${{ needs.build-android.outputs.plugin_release_tag }}
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "PLUGIN_RELEASE_TOKEN is required to publish optional plugins" >&2
          exit 1
        fi
        if gh release view "$PLUGIN_RELEASE_TAG" --repo "$PLUGIN_RELEASE_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$PLUGIN_RELEASE_TAG" optional-plugins/* \
            --repo "$PLUGIN_RELEASE_REPOSITORY" --clobber
        else
          gh release create "$PLUGIN_RELEASE_TAG" optional-plugins/* \
            --repo "$PLUGIN_RELEASE_REPOSITORY" \
            --title "$PLUGIN_RELEASE_TAG" \
            --notes "Optional companion APKs pinned by Lightly ${{ needs.build-android.outputs.version }}."
        fi

    - name: Create or update Lightly release
      uses: softprops/action-gh-release@v2
      with:
        body_path: release-body.md
        files: |
          dist/app-arm64-v8a-release.apk
          dist/app-armeabi-v7a-release.apk
          dist/SHA256SUMS
        generate_release_notes: false
        fail_on_unmatched_files: true
        overwrite_files: true
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
