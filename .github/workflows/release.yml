name: Release Android APK

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.6'

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.version.outputs.commit_hash }}
      version: ${{ steps.version.outputs.version }}
      build_version: ${{ steps.version.outputs.build_version }}
      version_code: ${{ steps.version.outputs.version_code }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.6'
        channel: 'stable'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi
    
    - name: Install cargo-ndk
      run: cargo install cargo-ndk
    
    - name: Build proxy-core native libraries
      run: |
        ./scripts/build_proxy_core.sh --all
        echo "✅ Proxy-core native libraries built"
        ls -lh android/app/src/main/jniLibs/*/libproxy_core.so
    
    - name: Get version info
      id: version
      run: |
        # Get short commit hash (6 characters)
        COMMIT_HASH=$(git rev-parse --short=6 HEAD)
        
        # Get version from tag or input
        if [ "${{ github.event_name }}" == "push" ]; then
          VERSION="${{ github.ref_name }}"
        else
          VERSION="${{ github.event.inputs.version }}"
        fi
        
        # Build version label with commit hash: tag+commit
        BUILD_VERSION="${VERSION}+${COMMIT_HASH}"

        git fetch --no-tags origin main:refs/remotes/origin/main

        # Calculate version code from main branch commit count with offset (5000+count).
        # Prefer origin/main so tag builds count main history instead of a detached tag-only ref.
        COMMIT_COUNT=$(git rev-list --count origin/main)
        VERSION_CODE=$((5000 + COMMIT_COUNT))
        
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "commit_hash=${COMMIT_HASH}" >> $GITHUB_OUTPUT
        echo "build_version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
        echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
        
        echo "📝 Version: ${VERSION}"
        echo "🔖 Commit: ${COMMIT_HASH}"
        echo "📦 Build Version: ${BUILD_VERSION}"
        echo "🔢 Version Code: ${VERSION_CODE}"
    
    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "❌ ERROR: KEYSTORE_BASE64 secret is not set"
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
        if [ ! -f "android/app/upload-keystore.jks" ] || [ ! -s "android/app/upload-keystore.jks" ]; then
          echo "❌ ERROR: Keystore file not created or empty"
          exit 1
        fi
        echo "✅ Keystore decoded ($(stat -c%s "android/app/upload-keystore.jks") bytes)"

    - name: Build arm64-v8a (64-bit)
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        export TARGET_ABI=arm64-v8a
        export BUILD_VERSION_LABEL="${{ steps.version.outputs.build_version }}"
        export BUILD_VERSION_CODE="${{ steps.version.outputs.version_code }}"
        
        flutter build apk \
          --release \
          --target-platform android-arm64 \
          --build-name="${{ steps.version.outputs.version }}" \
          --build-number="${{ steps.version.outputs.version_code }}" \
          --obfuscate \
          --split-debug-info=build/app/outputs/symbols
        
        mkdir -p dist
        cp build/app/outputs/flutter-apk/app-release.apk \
          dist/app-arm64-v8a-release.apk
        
        echo "✅ Built arm64-v8a APK"

    - name: Build armeabi-v7a (32-bit)
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError'"
        _JAVA_OPTIONS: '-Xmx12G'
      run: |
        export TARGET_ABI=armeabi-v7a
        export BUILD_VERSION_LABEL="${{ steps.version.outputs.build_version }}"
        export BUILD_VERSION_CODE="${{ steps.version.outputs.version_code }}"
        
        flutter build apk \
          --release \
          --target-platform android-arm \
          --build-name="${{ steps.version.outputs.version }}" \
          --build-number="${{ steps.version.outputs.version_code }}" \
          --obfuscate \
          --split-debug-info=build/app/outputs/symbols
        
        cp build/app/outputs/flutter-apk/app-release.apk \
          dist/app-armeabi-v7a-release.apk
        
        echo "✅ Built armeabi-v7a APK"
    
    - name: Show build artifacts
      run: |
        ls -lh dist/
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-apks
        path: dist/*.apk
        retention-days: 7

  release:
    name: Create Release
    needs: build-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: android-apks
        path: dist/
    
    - name: Display artifacts
      run: |
        ls -lh dist/
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*.apk
        generate_release_notes: true
        body: |
          ## Android Release ${{ github.ref_name }}
          
          ### 📱 下载安装包
          
          根据你的设备架构选择合适的 APK：
          
          | 文件名 | 架构 | 适用设备 |
          |--------|------|----------|
          | `app-arm64-v8a-release.apk` | ARM64 (64位) | 大多数现代安卓设备 |
          | `app-armeabi-v7a-release.apk` | ARMv7 (32位) | 老旧设备或低内存设备 |
          
          ### 🔧 安装说明
          
          1. 下载适合你设备架构的 APK
          2. 允许安装未知来源应用
          3. 安装 APK
          
          ### 🚀 功能特性

          - 浏览器保留完整标签页、下载、收藏、视频播放、站点数据清理与备份恢复能力
          - 远程控制支持屏幕观看、触摸/键盘/全局动作注入、剪贴板同步与 WebRTC 双向语音
          - EasyTier P2P VPN 可用于跨网络远控，并优先复用远控 TCP 已验证的可达地址
          - 发布包继续提供 arm64-v8a 与 armeabi-v7a 两个 ABI 分包

          ### 🔄 本次修改说明

          - 远程控制改为 WebRTC 语音链路，移除旧原生音频桥接，并保留内置代理模式下不启用语音的设计
          - 优化 EasyTier 场景下的 WebRTC 候选地址选择、overlay host 改写、远控 IP 优先策略和接收端播放音量
          - 增加远控控制/屏幕通道自动重连、WebRTC 失败重建，以及 EasyTier monitor 异常自动恢复
          - 修复部分红米机型全分辨率 AVC 编码失败导致的被控端黑屏，自动降级到兼容捕获尺寸
          - 修复 EasyTier 下控制端说话一段时间后被控端听不到的问题，增加 receiver 端远端音频停滞检测与恢复
          - 拆分 Browser / Remote 多个 coordinator、helper 与 widget 模块，补充浏览器、远控、WebRTC 回归测试
          - 优化浏览器 tab、地址栏、弹窗、X/YouTube 移动布局、登录态备份、Cookie origin 跟踪和站点数据清理
          - 发布脚本改为使用 `5000 + main 分支提交数` 作为 Android `versionCode`，避免误把功能分支提交数计入版本号
          
          ### 📝 版本信息
          
          - **版本**: ${{ github.ref_name }}
          - **提交**: ${{ needs.build-android.outputs.commit_hash }}
          - **构建时间**: ${{ github.event.head_commit.timestamp }}
          
          ### ⚠️ 注意事项
          
          - 首次安装可能需要授予无障碍服务权限（用于远程控制）
          - VPN 功能需要系统 VPN 权限
          - 录屏功能需要屏幕录制权限
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
