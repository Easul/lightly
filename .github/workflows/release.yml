name: Release Android APK

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.7'

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.version.outputs.commit_hash }}
      version: ${{ steps.version.outputs.version }}
      build_version: ${{ steps.version.outputs.build_version }}
      version_code: ${{ steps.version.outputs.version_code }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.6'
        channel: 'stable'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi
    
    - name: Install cargo-ndk
      run: cargo install cargo-ndk
    
    - name: Build proxy-core native libraries
      run: |
        ./scripts/build_proxy_core.sh --all
        echo "✅ Proxy-core native libraries built"
        ls -lh android/app/src/main/jniLibs/*/libproxy_core.so
    
    - name: Get version info
      id: version
      run: |
        # Get short commit hash (6 characters)
        COMMIT_HASH=$(git rev-parse --short=6 HEAD)
        
        # Get version from tag or input
        if [ "${{ github.event_name }}" == "push" ]; then
          VERSION="${{ github.ref_name }}"
        else
          VERSION="${{ github.event.inputs.version }}"
        fi
        
        # Build version label with commit hash: tag+commit
        BUILD_VERSION="${VERSION}+${COMMIT_HASH}"

        git fetch --no-tags origin main:refs/remotes/origin/main

        # Calculate version code from main branch commit count with offset (5000+count).
        # Prefer origin/main so tag builds count main history instead of a detached tag-only ref.
        COMMIT_COUNT=$(git rev-list --count origin/main)
        VERSION_CODE=$((5000 + COMMIT_COUNT))
        
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "commit_hash=${COMMIT_HASH}" >> $GITHUB_OUTPUT
        echo "build_version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
        echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
        
        echo "📝 Version: ${VERSION}"
        echo "🔖 Commit: ${COMMIT_HASH}"
        echo "📦 Build Version: ${BUILD_VERSION}"
        echo "🔢 Version Code: ${VERSION_CODE}"
    
    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "❌ ERROR: KEYSTORE_BASE64 secret is not set"
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
        if [ ! -f "android/app/upload-keystore.jks" ] || [ ! -s "android/app/upload-keystore.jks" ]; then
          echo "❌ ERROR: Keystore file not created or empty"
          exit 1
        fi
        echo "✅ Keystore decoded ($(stat -c%s "android/app/upload-keystore.jks") bytes)"

    - name: Build multi-ABI APKs
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        RELEASE_VERSION_TAG: ${{ steps.version.outputs.version }}
        GRADLE_WORKERS: '2'
        ARM64_HEAP: 6G
        ARM32_HEAP: 8G
      run: |
        mkdir -p dist
        bash scripts/build_multi_abi.sh
        cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
          dist/app-arm64-v8a-release.apk
        cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
          dist/app-armeabi-v7a-release.apk
        echo "✅ Built multi-ABI APKs via scripts/build_multi_abi.sh"
    
    - name: Show build artifacts
      run: |
        ls -lh dist/
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-apks
        path: dist/*.apk
        retention-days: 7

  release:
    name: Create Release
    needs: build-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: android-apks
        path: dist/
    
    - name: Display artifacts
      run: |
        ls -lh dist/
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*.apk
        generate_release_notes: true
        body: |
          ## Android Release ${{ github.ref_name }}
          
          ### 📱 下载安装包
          
          根据你的设备架构选择合适的 APK：
          
          | 文件名 | 架构 | 适用设备 |
          |--------|------|----------|
          | `app-arm64-v8a-release.apk` | ARM64 (64位) | 大多数现代安卓设备 |
          | `app-armeabi-v7a-release.apk` | ARMv7 (32位) | 老旧设备或低内存设备 |
          
          ### 🔧 安装说明
          
          1. 下载适合你设备架构的 APK
          2. 允许安装未知来源应用
          3. 安装 APK
          
          ### 🚀 功能特性

          - 浏览器保留完整标签页、下载、收藏、视频播放、站点数据清理与备份恢复能力
          - 远程控制支持屏幕观看、触摸/键盘/全局动作注入、轨迹滑动、远端标注、剪贴板同步与 WebRTC 双向语音
          - EasyTier P2P VPN 可用于跨网络远控，并支持 VPN 与 no-VPN/no-tun 两种运行方式
          - 文件简易管理支持通过本地网页浏览文件树、编辑保存文本文件、删除确认和收藏路径
          - 发布包继续提供 arm64-v8a 与 armeabi-v7a 两个 ABI 分包

          ### 🔄 本次修改说明

          - 新增 `设置 → 文件简易管理`，默认 `/storage/emulated/0` 与端口 `12580`，支持文本文件编辑、删除确认和收藏路径滚动面板
          - 增强远控操作：控制端最小化、临时关闭、点亮屏幕、轨迹滑动、键盘输入、远端标注和全局断连提示
          - 增加 P2P / EasyTier no-VPN 模式、结构化端口映射、no-tun SOCKS5 连接路径和 EasyTier 状态共享 Provider
          - 修复 Redmi / Qualcomm 远控黑屏与高分辨率解码问题，优化屏幕帧发送以降低弱网延迟
          - 优化浏览器 overlay、tab keep-alive、外部文件打开、下载播放、站点数据清理和备份恢复路径
          - 代理节点支持保存/选择/删除，SOCKS5 / Telegram 兼容性继续强化
          - 拆分 Browser / Remote / EasyTier / Downloads / Proxy 多个大模块，并补充对应回归测试
          - Release workflow 改为复用 `scripts/build_multi_abi.sh`，与本地发布保持一致
          
          ### 📝 版本信息
          
          - **版本**: ${{ github.ref_name }}
          - **提交**: ${{ needs.build-android.outputs.commit_hash }}
          - **构建时间**: ${{ github.event.head_commit.timestamp }}
          
          ### ⚠️ 注意事项
          
          - 首次安装可能需要授予无障碍服务权限（用于远程控制）
          - VPN 功能需要系统 VPN 权限
          - 录屏功能需要屏幕录制权限
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
